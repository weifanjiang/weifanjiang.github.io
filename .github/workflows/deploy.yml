name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # jekyll-imagemagick needs the `convert` binary; the ubuntu-24.04 runner
      # image no longer ships ImageMagick, which silently broke this build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.2'
      # Deliberately NOT using bundler-cache: it installs into vendor/bundle,
      # where Ruby 3.0's built-in `uri` default gem wins activation over the
      # version the lockfile pins and the build dies with a Gem::LoadError.
      # Installing into the default gem path is what works locally.
      - name: Install gems
        run: |
          gem install bundler -v 2.4.22
          bundle install --jobs 4
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          if ! bundle exec jekyll build > /tmp/build.log 2>&1; then
            tail -60 /tmp/build.log
            msg=$(head -c 2500 /tmp/build.log | sed ':a;N;$!ba;s/\r//g; s/\n/%0A/g')
            echo "::error title=jekyll-build::${msg}"
            exit 1
          fi
      - name: Deploy to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
